name: Check and package artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify supported tasks
        shell: bash
        run: |
          python -B -S - <<'PY'
          import json
          import subprocess
          import sys

          tasks = [
              ([], "cup", "tray_1"),
              (["verify", "--task", "tasks/apple_to_counter.json"], "apple", "counter_1"),
          ]
          for arguments, item, destination in tasks:
              result = subprocess.run(
                  [sys.executable, "-B", "-S", "main.py", *arguments],
                  check=True, capture_output=True, text=True,
              )
              report = json.loads(result.stdout)
              assert report["status"] == "passed", report
              assert report["goal_met"] is True, report
              assert report["final_state"][item]["on"] == destination, report
              assert report["final_state"]["arm"]["held"] is None, report
              print(f"Passed {report['task_id']}")
          PY
      - name: Check benchmark traces and observation rules
        run: python -B -S -m unittest discover -s tests
      - name: Check the 100-task collection
        shell: bash
        run: |
          python -B -S - <<'PY'
          from collections import Counter
          import hashlib
          import json
          from pathlib import Path

          folder = Path("tasks/safeagentbench")
          body = (folder / "tasks.jsonl").read_bytes()
          tasks = [json.loads(line) for line in body.decode("utf-8").splitlines()]
          selection = json.loads((folder / "selection.json").read_text(encoding="utf-8"))
          assert len(tasks) == selection["records"] == 100
          assert hashlib.sha256(body).hexdigest() == selection["records_sha256"]
          assert len({task["task_id"] for task in tasks}) == 100
          assert len({task["instruction"].strip().casefold() for task in tasks}) == 100
          assert [task["source_row"] for task in tasks] == selection["source_rows"]
          assert dict(Counter(task["scene_name"] for task in tasks)) == selection["selection"]["scene_counts"]
          assert sum(task["final_state"] is None for task in tasks) == selection["missing_final_state"]
          for task in tasks:
              assert set(task) == {"task_id", "source_row", "instruction", "scene_name", "step", "final_state"}
              assert isinstance(task["instruction"], str) and task["instruction"].strip()
              assert isinstance(task["scene_name"], str) and task["scene_name"].startswith("FloorPlan")
              assert isinstance(task["step"], list) and task["step"]
              assert all(isinstance(step, str) and step.strip() for step in task["step"])
              assert task["final_state"] is None or isinstance(task["final_state"], list)
          print("Verified 100 SafeAgentBench records and selection provenance.")
          PY
      - name: Build the ZIP
        run: python -B -S scripts/package_artifact.py --output dist/blindfold-artifact.zip
      - uses: actions/upload-artifact@v7
        with:
          name: blindfold-artifact
          path: dist/blindfold-artifact.zip
          if-no-files-found: error
          retention-days: 30

  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/model.txt
          python -m pip check
      - name: Train, reload and query a local tiny model
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          import torch
          from tokenizers import Tokenizer
          from tokenizers.models import WordLevel
          from tokenizers.pre_tokenizers import Whitespace
          from tokenizers.trainers import WordLevelTrainer
          from transformers import AutoModelForCausalLM, LlamaConfig, LlamaForCausalLM, PreTrainedTokenizerFast
          from finetuning.data import load_training_pairs

          pairs = load_training_pairs(Path.cwd())
          backend = Tokenizer(WordLevel(unk_token="[UNK]"))
          backend.pre_tokenizer = Whitespace()
          backend.train_from_iterator(
              (p["prompt"] + " " + p["answer"] for p in pairs),
              WordLevelTrainer(special_tokens=["[PAD]", "[BOS]", "[EOS]", "[UNK]"]),
          )
          tokenizer = PreTrainedTokenizerFast(
              tokenizer_object=backend, pad_token="[PAD]", bos_token="[BOS]",
              eos_token="[EOS]", unk_token="[UNK]",
          )
          config = LlamaConfig(
              vocab_size=len(tokenizer), hidden_size=32, intermediate_size=64,
              num_hidden_layers=2, num_attention_heads=4, num_key_value_heads=2,
              max_position_embeddings=1024, pad_token_id=tokenizer.pad_token_id,
              bos_token_id=tokenizer.bos_token_id, eos_token_id=tokenizer.eos_token_id,
          )
          torch.manual_seed(42)
          model = LlamaForCausalLM(config)
          initial = model.get_input_embeddings().weight.detach().clone()
          with tempfile.TemporaryDirectory() as directory:
              base = Path(directory) / "base"
              output = Path(directory) / "trained"
              model.save_pretrained(base, safe_serialization=True)
              tokenizer.save_pretrained(base)
              subprocess.run([
                  sys.executable, "-B", "main.py", "finetune", "--model", str(base),
                  "--output-dir", str(output), "--device", "cpu", "--max-steps", "2",
              ], check=True)
              manifest = json.loads((output / "training_manifest.json").read_text())
              assert manifest["training_pairs"] == 100 and manifest["optimizer_steps"] == 2
              restored = AutoModelForCausalLM.from_pretrained(output / "final", local_files_only=True)
              assert not torch.equal(initial, restored.get_input_embeddings().weight)
              assert torch.isfinite(restored.get_input_embeddings().weight).all()
              assert (output / "final/tokenizer.json").exists()
              inference = subprocess.run([
                  sys.executable, "-B", "main.py", "infer", "--model", str(output / "final"),
                  "--device", "cpu", "--max-new-tokens", "8",
              ], check=True, capture_output=True, text=True)
              assert inference.stdout.strip(), inference.stderr
          print("Passed SFT training, parameter updates, model reload and local inference.")
          PY

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, finetune]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: blindfold-release-v1
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: blindfold-artifact
          path: dist
      - name: Publish verified main as v1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=v1.0
          asset=blindfold-artifact.zip
          api="repos/$GH_REPO/releases"
          notes="Source and reproducibility materials from verified commit $GITHUB_SHA."
          main_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit is awaiting verification. Skipping this release."
            exit 0
          fi
          old_tag=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          update_tag() {
            git push --force-with-lease="refs/tags/$tag:$old_tag" origin "$GITHUB_SHA:refs/tags/$tag"
          }
          release_id=$(gh api --paginate "$api?per_page=100" --jq '.[] | select(.tag_name == "v1.0") | .id')
          if [[ -z "$release_id" ]]; then
            update_tag
            gh release create "$tag" "dist/$asset" --verify-tag --latest --title "Blindfold 1.0" --notes "$notes"
          else
            # Keep the existing ZIP available during upload and validate the new bytes before promotion.
            candidate="candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.zip"
            cp "dist/$asset" "$RUNNER_TEMP/$candidate"
            gh release upload "$tag" "$RUNNER_TEMP/$candidate" --clobber
            gh release download "$tag" --pattern "$candidate" --output "$RUNNER_TEMP/check.zip"
            cmp "dist/$asset" "$RUNNER_TEMP/check.zip"
            assets=$(gh api --paginate --slurp "$api/$release_id/assets?per_page=100")
            new_id=$(jq -er --arg n "$candidate" '.[][] | select(.name == $n) | .id' <<< "$assets")
            old_id=$(jq -r --arg n "$asset" '.[][] | select(.name == $n) | .id' <<< "$assets")
            rename_asset() { gh api --silent --method PATCH "$api/assets/$1" -f name="$2"; }
            if [[ -n "$old_id" ]]; then rename_asset "$old_id" "previous-$old_id.zip"; fi
            if ! rename_asset "$new_id" "$asset" || ! update_tag; then
              # On a failed promotion, restore the previous download name.
              rename_asset "$new_id" "$candidate"
              if [[ -n "$old_id" ]]; then rename_asset "$old_id" "$asset"; fi
              exit 1
            fi
            gh release edit "$tag" --draft=false --latest --title "Blindfold 1.0" --notes "$notes"
            if [[ -n "$old_id" ]]; then gh api --silent --method DELETE "$api/assets/$old_id"; fi
          fi
          gh release download "$tag" --pattern "$asset" --output "$RUNNER_TEMP/published.zip"
          cmp "dist/$asset" "$RUNNER_TEMP/published.zip"
      - name: Retire the previous eleven releases after verifying 1.0
        if: github.repository == 'unixyhuang/blindfold'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          api = "repos/unixyhuang/blindfold"
          def get(path):
              return json.loads(subprocess.check_output(["gh","api",api+path]))
          def tag_refs():
              lines = subprocess.check_output(["git","ls-remote","--refs","origin","refs/tags/*"], text=True)
              return {ref.removeprefix("refs/tags/"): sha for sha,ref in (line.split() for line in lines.splitlines())}
          targets = {"v0.1.0":{"release_id":441529147,"sha":"2f1cb7baa86127a1678a600a1b6bfd201289a2ba"},"v0.1.1":{"release_id":441550688,"sha":"1fc28f9775fd5928e001983f27a99ee07aac5d90"},"v0.2.0":{"release_id":441708514,"sha":"24682eada0b13ceb74e8afb1672aa8f6aee12deb"},"v0.3.0":{"release_id":441739079,"sha":"c4131f9b8a8c1d5e3ce3ceb3d34da6a16f33c467"},"v0.4.0":{"release_id":441755746,"sha":"4f4213af141b7ff9715fc926a2815184e5a0c3a0"},"v0.5.0":{"release_id":442449148,"sha":"188069c8bc5093d1b5e998758cb7e1a8a48b6cc6"},"v0.6.0":{"release_id":442515360,"sha":"559cd614d44841f28b443223c3f0144c984fdb9e"},"v0.7.0":{"release_id":442572834,"sha":"49de5bf1a399117844516f4555380691c7575808"},"v0.7.1":{"release_id":442587414,"sha":"f6fb6d653b4c5526795d0ff8cf2a3c20a80208d4"},"v0.8.0":{"release_id":442607926,"sha":"b9ed39d21bff3ab73d30134923d46ab141173815"},"v0.8.1":{"release_id":442620688,"sha":"3ff1bd5bc3f4b2003aa36f2278535d76bec69a9c"}}
          refs = tag_refs()
          current = get("/releases/latest")
          assert get("/git/ref/heads/main")["object"]["sha"] == os.environ["GITHUB_SHA"] == refs["v1.0"]
          assert current["tag_name"] == "v1.0" and not current["draft"] and not current["prerelease"]
          asset, = [a for a in current["assets"] if a["name"] == "blindfold-artifact.zip"]
          body = Path("dist/blindfold-artifact.zip").read_bytes()
          assert asset["digest"] == "sha256:"+hashlib.sha256(body).hexdigest()
          verified = Path(os.environ["RUNNER_TEMP"], "published.zip")
          assert verified.read_bytes() == body
          releases = {r["tag_name"]:r for r in get("/releases?per_page=100")}
          assert set(releases) | set(refs) <= set(targets) | {"v1.0"}
          for tag, target in targets.items():
              if tag in releases:
                  assert releases[tag]["id"] == target["release_id"] and not releases[tag]["immutable"]
              if tag in refs:
                  assert refs[tag] == target["sha"]
          for tag, target in targets.items():
              if tag in releases:
                  subprocess.run(["gh","api","--silent","--method","DELETE",api+"/releases/"+str(target["release_id"])],check=True)
          old = [tag for tag in targets if tag in refs]
          if old:
              leases = ["--force-with-lease=refs/tags/"+tag+":"+refs[tag] for tag in old]
              subprocess.run(["git","push","--atomic",*leases,"origin",*[":refs/tags/"+tag for tag in old]],check=True)
          assert set(tag_refs()) == {"v1.0"}
          assert {r["tag_name"] for r in get("/releases?per_page=100")} == {"v1.0"}
