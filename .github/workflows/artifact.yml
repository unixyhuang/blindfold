name: Check and package artifact

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify supported tasks
        shell: bash
        run: |
          python -B -S - <<'PY'
          import json
          import subprocess
          import sys

          tasks = [
              ([], "cup", "tray_1"),
              (["verify", "--task", "tasks/apple_to_counter.json"], "apple", "counter_1"),
          ]
          for arguments, item, destination in tasks:
              result = subprocess.run(
                  [sys.executable, "-B", "-S", "main.py", *arguments],
                  check=True, capture_output=True, text=True,
              )
              report = json.loads(result.stdout)
              assert report["status"] == "passed", report
              assert report["goal_met"] is True, report
              assert report["final_state"][item]["on"] == destination, report
              assert report["final_state"]["arm"]["held"] is None, report
              print(f"Passed {report['task_id']}")
          PY
      - name: Check the 100-task collection
        shell: bash
        run: |
          python -B -S - <<'PY'
          from collections import Counter
          import hashlib
          import json
          from pathlib import Path

          folder = Path("tasks/safeagentbench")
          body = (folder / "tasks.jsonl").read_bytes()
          tasks = [json.loads(line) for line in body.decode("utf-8").splitlines()]
          selection = json.loads((folder / "selection.json").read_text(encoding="utf-8"))
          assert len(tasks) == selection["records"] == 100
          assert hashlib.sha256(body).hexdigest() == selection["records_sha256"]
          assert len({task["task_id"] for task in tasks}) == 100
          assert len({task["instruction"].strip().casefold() for task in tasks}) == 100
          assert [task["source_row"] for task in tasks] == selection["source_rows"]
          assert dict(Counter(task["scene_name"] for task in tasks)) == selection["selection"]["scene_counts"]
          assert sum(task["final_state"] is None for task in tasks) == selection["missing_final_state"]
          for task in tasks:
              assert set(task) == {"task_id", "source_row", "instruction", "scene_name", "step", "final_state"}
              assert isinstance(task["instruction"], str) and task["instruction"].strip()
              assert isinstance(task["scene_name"], str) and task["scene_name"].startswith("FloorPlan")
              assert isinstance(task["step"], list) and task["step"]
              assert all(isinstance(step, str) and step.strip() for step in task["step"])
              assert task["final_state"] is None or isinstance(task["final_state"], list)
          print("Verified 100 SafeAgentBench records and selection provenance.")
          PY
      - name: Build the ZIP
        run: python -B -S scripts/package_artifact.py --output dist/blindfold-artifact.zip
      - uses: actions/upload-artifact@v7
        with:
          name: blindfold-artifact
          path: dist/blindfold-artifact.zip
          if-no-files-found: error
          retention-days: 30

  finetune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/finetune.txt
          python -m pip check
      - name: Train and reload a local tiny model
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import subprocess
          import sys
          import tempfile
          from pathlib import Path
          import torch
          from tokenizers import Tokenizer
          from tokenizers.models import WordLevel
          from tokenizers.pre_tokenizers import Whitespace
          from tokenizers.trainers import WordLevelTrainer
          from transformers import AutoModelForCausalLM, LlamaConfig, LlamaForCausalLM, PreTrainedTokenizerFast
          from finetuning.data import load_training_pairs

          pairs = load_training_pairs(Path.cwd())
          backend = Tokenizer(WordLevel(unk_token="[UNK]"))
          backend.pre_tokenizer = Whitespace()
          backend.train_from_iterator(
              (p["prompt"] + " " + p["answer"] for p in pairs),
              WordLevelTrainer(special_tokens=["[PAD]", "[BOS]", "[EOS]", "[UNK]"]),
          )
          tokenizer = PreTrainedTokenizerFast(
              tokenizer_object=backend, pad_token="[PAD]", bos_token="[BOS]",
              eos_token="[EOS]", unk_token="[UNK]",
          )
          config = LlamaConfig(
              vocab_size=len(tokenizer), hidden_size=32, intermediate_size=64,
              num_hidden_layers=2, num_attention_heads=4, num_key_value_heads=2,
              max_position_embeddings=1024, pad_token_id=tokenizer.pad_token_id,
              bos_token_id=tokenizer.bos_token_id, eos_token_id=tokenizer.eos_token_id,
          )
          torch.manual_seed(42)
          model = LlamaForCausalLM(config)
          initial = model.get_input_embeddings().weight.detach().clone()
          with tempfile.TemporaryDirectory() as directory:
              base = Path(directory) / "base"
              output = Path(directory) / "trained"
              model.save_pretrained(base, safe_serialization=True)
              tokenizer.save_pretrained(base)
              subprocess.run([
                  sys.executable, "-B", "main.py", "finetune", "--model", str(base),
                  "--output-dir", str(output), "--device", "cpu", "--max-steps", "2",
              ], check=True)
              manifest = json.loads((output / "training_manifest.json").read_text())
              assert manifest["training_pairs"] == 100 and manifest["optimizer_steps"] == 2
              restored = AutoModelForCausalLM.from_pretrained(output / "final", local_files_only=True)
              assert not torch.equal(initial, restored.get_input_embeddings().weight)
              assert torch.isfinite(restored.get_input_embeddings().weight).all()
              assert (output / "final/tokenizer.json").exists()
          print("Passed standard SFT training, parameter updates and model reload.")
          PY

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, finetune]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build the tagged source ZIP
        run: python -B -S scripts/package_artifact.py --output dist/blindfold-artifact.zip
      - name: Publish the tagged ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/blindfold-artifact.zip --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" dist/blindfold-artifact.zip --repo "$GH_REPO" --verify-tag --generate-notes
          fi
